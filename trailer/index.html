<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Unbounded"; font-weight: 900; src: url("assets/fonts/unbounded-cyrillic-900-normal.woff2") format("woff2"); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Unbounded"; font-weight: 900; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); }
      :root { --red: #e2231a; --ink: #111; --yellow: #f3c117; --paper: #f5efe0; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #140a08; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Unbounded, sans-serif; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 42%, #5a2a1c, #1d0e0a 60%, #0d0605); }
      /* заставка */
      #sun { position: absolute; left: 960px; top: 540px; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: var(--red); border: 14px solid #111; }
      #rays { position: absolute; inset: -200px; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(0, 0, 0, .55) 0 4deg, transparent 4deg 10deg); }
      #t1 { position: absolute; left: 0; right: 0; top: 360px; text-align: center; font-weight: 900; font-size: 190px; color: #fff; -webkit-text-stroke: 10px #111; paint-order: stroke fill; text-shadow: 14px 14px 0 #111; }
      #t2 { position: absolute; left: 0; right: 0; top: 640px; text-align: center; }
      #t2 b { display: inline-block; font-weight: 900; font-size: 54px; color: #111; background: var(--yellow); border: 8px solid #111; padding: 10px 30px; box-shadow: 12px 12px 0 #111; }
      /* съёмка книги */
      #book { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      .tag { position: absolute; left: 60px; bottom: 70px; font-weight: 900; font-size: 46px; color: #111; background: var(--yellow); border: 7px solid #111; padding: 10px 24px; box-shadow: 10px 10px 0 #111; }
      .tag i { font-style: normal; color: #8f0d08; margin-left: 14px; }
      /* финал */
      #end { position: absolute; inset: 0; background: var(--red); }
      #e1 { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-weight: 900; font-size: 150px; color: #fff; -webkit-text-stroke: 9px #111; paint-order: stroke fill; text-shadow: 12px 12px 0 #111; }
      #e2 { position: absolute; left: 0; right: 0; top: 560px; text-align: center; }
      #e2 b { display: inline-block; font-weight: 900; font-size: 60px; color: #111; background: var(--yellow); border: 8px solid #111; padding: 12px 34px; box-shadow: 12px 12px 0 #111; }
      #e3 { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-weight: 900; font-size: 40px; color: #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.5" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="23.5" data-track-index="0"></div>

      <div id="rays" class="clip" data-start="0" data-duration="2.0" data-track-index="1"></div>
      <div id="sun" class="clip" data-start="0" data-duration="2.0" data-track-index="2"></div>
      <div id="t1" class="clip" data-start="0" data-duration="2.0" data-track-index="3">ТАЙНОПИСЬ</div>
      <div id="t2" class="clip" data-start="0" data-duration="2.0" data-track-index="4"><b>3D-КОМИКС · ВЫПУСК №1</b></div>

      <video id="book" class="clip" src="assets/book.mp4" data-start="1.9" data-duration="19" data-track-index="5" muted playsinline></video>

      <div id="g1" class="tag clip" data-start="6.3" data-duration="2.2" data-track-index="6">СПАРТА<i>V в. до н. э.</i></div>
      <div id="g2" class="tag clip" data-start="9.4" data-duration="1.7" data-track-index="7">ГАЛЛИЯ<i>58 до н. э.</i></div>
      <div id="g3" class="tag clip" data-start="11.2" data-duration="1.9" data-track-index="8">ЗАСАДА<i>«ХВАТЬ!»</i></div>
      <div id="g4" class="tag clip" data-start="13.9" data-duration="1.4" data-track-index="9">БАГДАД<i>IX век</i></div>
      <div id="g5" class="tag clip" data-start="15.4" data-duration="1.9" data-track-index="10">ЭНИГМА<i>1940</i></div>
      <div id="g7" class="tag clip" data-start="19.2" data-duration="1.6" data-track-index="16">ВЫВОД<i>метод + ключ</i></div>
      <div id="g6" class="tag clip" data-start="17.9" data-duration="1.2" data-track-index="11">RSA<i>1977</i></div>

      <audio id="score" src="assets/score.wav" data-start="0" data-duration="23.5" data-volume="1"></audio>
      <div id="end" class="clip" data-start="20.9" data-duration="2.6" data-track-index="12"></div>
      <div id="e1" class="clip" data-start="20.9" data-duration="2.6" data-track-index="13">ЛИСТАЙ КОМИКС</div>
      <div id="e2" class="clip" data-start="20.9" data-duration="2.6" data-track-index="14"><b>2500 ЛЕТ ШИФРОВ И ВЗЛОМОВ</b></div>
      <div id="e3" class="clip" data-start="20.9" data-duration="2.6" data-track-index="15">nurmukasan.github.io/comics</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // заставка: круг уже на экране, надпись вбивается, лучи вращаются
      tl.fromTo("#rays", { rotation: 0 }, { rotation: 14, duration: 2.0, ease: "none" }, 0);
      tl.fromTo("#sun", { scale: 0.8 }, { scale: 1.06, duration: 1.68, ease: "power1.out" }, 0);
      tl.fromTo("#t1", { scale: 1.5, rotation: -4 }, { scale: 1, rotation: -2, duration: 0.35, ease: "power3.in" }, 0.05);
      tl.fromTo("#t2", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "back.out(2)" }, 0.2);
      // уход заставки: круг раскрывается на весь кадр
      tl.to("#sun", { scale: 3.2, duration: 0.3, ease: "power2.in" }, 1.68);
      tl.to(["#t1", "#t2"], { opacity: 0, duration: 0.2 }, 1.72);
      // лёгкий наезд на съёмку книги
      tl.fromTo("#book", { scale: 1.04 }, { scale: 1, duration: 19, ease: "none" }, 1.9);
      // ярлыки глав выпрыгивают
      ["#g1", "#g2", "#g3", "#g4", "#g5", "#g6", "#g7"].forEach((id, i) => {
        const t = [6.3, 9.4, 11.2, 13.9, 15.4, 17.9, 19.2][i];
        tl.fromTo(id, { x: -80, rotation: -6, opacity: 0 }, { x: 0, rotation: -2, opacity: 1, duration: 0.3, ease: "back.out(2)" }, t + 0.02);
      });
      // финал
      tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 20.9);
      tl.fromTo("#e1", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.in" }, 20.95);
      tl.fromTo("#e2", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 21.1);
      tl.fromTo("#e3", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 21.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
